
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Courses</h2>

                <a th:href="@{/course/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>
                    Add New Course
                </a>
            </div>

            <div th:if="${message != null}"
                 class="alert alert-success text-center"
                 th:text="${message}">
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i>
                    Course List
                </div>

                <div class="card-body">

                    <!-- Search -->
                    <form th:action="@{/course/list}"
                          method="get"
                          class="row g-2 mb-4">

                        <div class="col-md-8">
                            <input type="text"
                                   name="keyword"
                                   class="form-control"
                                   placeholder="Search by course name, code or duration..."
                                   th:value="${keyword}">
                        </div>

                        <input type="hidden" name="size" value="3">

                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>

                        <div class="col-md-2">
                            <a th:href="@{/course/list}"
                               class="btn btn-secondary w-100">
                                <i class="bi bi-x-circle"></i> Clear
                            </a>
                        </div>
                    </form>

                    <!-- Empty Message -->
                    <div class="text-muted"
                         th:if="${courses.content.isEmpty()}">
                        No course found.
                    </div>

                    <!-- Course Table -->
                    <div class="table-responsive"
                         th:unless="${courses.content.isEmpty()}">

                        <table class="table table-hover table-striped">

                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Course Name</th>
                                <th>Course Code</th>
                                <th>Course Fees</th>
                                <th>Duration</th>
                                <th>Actions</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="course : ${courses.content}">

                                <td th:text="${course.id}"></td>
                                <td th:text="${course.courseName}"></td>
                                <td th:text="${course.courseCode}"></td>
                                <td th:text="${course.fee}"></td>
                                <td th:text="${course.duration}"></td>

                                <td>

                                    <!-- View Button -->
                                    <a th:href="@{/course/{id}(id=${course.id})}"
                                       class="btn btn-sm btn-info text-white me-1"
                                       title="View">
                                        <i class="bi bi-eye"></i>
                                    </a>

                                    <!-- Edit Button -->
                                    <a th:href="@{/course/{id}/edit(id=${course.id})}"
                                       class="btn btn-sm btn-warning text-white me-1"
                                       title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <!-- Delete Button -->
                                    <form th:action="@{/course/{id}/delete(id=${course.id})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete this course?');">

                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">

                                        <button type="submit"
                                                class="btn btn-sm btn-danger"
                                                title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>

                                    </form>

                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${courses.totalPages > 1}"
                         aria-label="Course pagination">

                        <ul class="pagination justify-content-end">

                            <!-- Previous -->
                            <li class="page-item"
                                th:classappend="${courses.first} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/course/list(page=${courses.number > 0 ? courses.number - 1 : 0},size=${courses.size},keyword=${keyword})}">
                                    Previous
                                </a>
                            </li>

                            <!-- Page Numbers -->
                            <li class="page-item"
                                th:each="pageNum : ${#numbers.sequence(0, courses.totalPages - 1)}"
                                th:classappend="${pageNum == courses.number} ? 'active'">

                                <a class="page-link"
                                   th:href="@{/course/list(page=${pageNum},size=${courses.size},keyword=${keyword})}"
                                   th:text="${pageNum + 1}">
                                </a>
                            </li>

                            <!-- Next -->
                            <li class="page-item"
                                th:classappend="${courses.last} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/course/list(page=${courses.number + 1 < courses.totalPages ? courses.number + 1 : courses.number},size=${courses.size},keyword=${keyword})}">
                                    Next
                                </a>
                            </li>

                        </ul>
                    </nav>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
