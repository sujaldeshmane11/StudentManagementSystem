
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

    <div class="d-flex" id="wrapper">

        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <div th:replace="~{fragments/layout :: navbar}"></div>

            <div class="container-fluid px-4 py-4">

                <!-- Page Heading -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Edit Student</h2>

                    <a th:href="@{/students/list}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i>
                        Back to List
                    </a>
                </div>

                <!-- Student Form Card -->
                <div class="card mb-4">

                    <div class="card-header bg-white">
                        <i class="bi bi-pencil-square me-1"></i>
                        Student Details
                    </div>

                    <div class="card-body">

                        <form th:action="@{/students/update/{id}(id=${studentDTO.id})}"
                              th:object="${studentDTO}"
                              method="post">

                            <input type="hidden" th:field="*{id}">

                            <!-- First Name and Last Name -->
                            <div class="row mb-3">

                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">
                                        First Name
                                    </label>

                                    <input type="text"
                                           th:field="*{firstName}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                                           id="firstName"
                                           placeholder="Enter first name"
                                           required>

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('firstName')}"
                                         th:errors="*{firstName}">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">
                                        Last Name
                                    </label>

                                    <input type="text"
                                           th:field="*{lastName}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                                           id="lastName"
                                           placeholder="Enter last name"
                                           required>

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('lastName')}"
                                         th:errors="*{lastName}">
                                    </div>
                                </div>

                            </div>

                            <!-- Email and Phone Number -->
                            <div class="row mb-3">

                                <div class="col-md-6">
                                    <label for="email" class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           th:field="*{email}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           id="email"
                                           placeholder="Enter email address"
                                           required>

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="phoneNumber" class="form-label">
                                        Phone Number
                                    </label>

                                    <input type="text"
                                           th:field="*{phoneNumber}"
                                           class="form-control"
                                           id="phoneNumber"
                                           placeholder="Enter phone number"
                                           required>

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('phoneNumber')}"
                                         th:errors="*{phoneNumber}">
                                    </div>
                                </div>

                            </div>

                            <!-- Multiple Course Selection -->
                            <div class="row mb-3">

                                <div class="col-md-6">

                                    <label for="courseIds" class="form-label">
                                        Select Courses
                                    </label>

                                    <select th:field="*{courseIds}"
                                            class="form-select"
                                            id="courseIds"
                                            multiple
                                            size="5">

                                        <option th:each="course : ${courses}"
                                                th:value="${course.id}"
                                                th:text="${course.courseName + ' (' + course.courseCode + ') - ₹' + course.fee}">
                                        </option>

                                    </select>

                                    <small class="text-muted">
                                        Hold Ctrl to select or deselect multiple courses.
                                    </small>

                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('courseIds')}"
                                         th:errors="*{courseIds}">
                                    </div>

                                </div>

                            </div>

                            <!-- Address -->
                            <div class="mb-3">

                                <label for="address" class="form-label">
                                    Address
                                </label>

                                <textarea th:field="*{address}"
                                          class="form-control"
                                          th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                                          id="address"
                                          rows="4"
                                          placeholder="Enter student address"
                                          required></textarea>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('address')}"
                                     th:errors="*{address}">
                                </div>

                            </div>

                            <!-- Buttons -->
                            <div class="d-flex justify-content-end">

                                <button type="reset" class="btn btn-light me-2">
                                    Reset
                                </button>

                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i>
                                    Update Student
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
