
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

    <!-- Sidebar -->
    <div th:fragment="sidebar"
         class="bg-dark text-white"
         id="sidebar-wrapper">

        <div class="sidebar-heading border-bottom border-secondary p-3">
            <i class="bi bi-mortarboard-fill me-2"></i>
            SMS Admin
        </div>

        <div class="list-group list-group-flush">

            <!-- Dashboard -->
            <a th:href="@{/dashboard}" class="sidebar-link">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <!-- Courses -->
            <a th:href="@{/course/list}" class="sidebar-link">
                <i class="bi bi-book"></i>
                Courses
            </a>

            <!-- Students -->
            <a th:href="@{/students/list}" class="sidebar-link">
                <i class="bi bi-people"></i>
                Students
            </a>

            <!-- Enrolled Students -->
            <a th:href="@{/enrollment/students}" class="sidebar-link">
                <i class="bi bi-person-check"></i>
                Enrolled Students
            </a>

            <!-- Enroll to Course -->
            <a th:href="@{/enrollment/new}" class="sidebar-link">
                <i class="bi bi-person-plus"></i>
                Enroll to Course
            </a>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post"
                  class="mt-auto border-top border-secondary">

                <button type="submit"
                        class="sidebar-link w-100 text-start border-0 bg-transparent text-white">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </button>
            </form>

        </div>
    </div>


    <!-- Navbar -->
    <nav th:fragment="navbar"
         class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

        <div class="container-fluid">

            <button class="btn btn-outline-secondary"
                    id="sidebarToggle"
                    type="button">

                <i class="bi bi-list"></i>
            </button>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="navbarSupportedContent">

                <ul class="navbar-nav ms-auto mt-2 mt-lg-0">

                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           id="navbarDropdown"
                           role="button"
                           data-bs-toggle="dropdown">

                            <i class="bi bi-person-circle me-1"></i>
                            Admin User

                        </a>

                        <div class="dropdown-menu dropdown-menu-end">

                            <form th:action="@{/logout}" method="post">

                                <button type="submit"
                                        class="dropdown-item">

                                    <i class="bi bi-box-arrow-right me-2"></i>
                                    Logout

                                </button>

                            </form>

                        </div>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Footer -->
    <footer th:fragment="footer"
            class="py-4 bg-light mt-auto border-top">

        <div class="container-fluid px-4">

            <div class="d-flex align-items-center justify-content-between small">

                <div class="text-muted">
                    Copyright &copy; Student Management System 2026
                </div>

                <div>
                    <a href="#">Privacy Policy</a>
                    &middot;
                    <a href="#">Terms &amp; Conditions</a>
                </div>

            </div>
        </div>
    </footer>


    <!-- Scripts -->
    <th:block th:fragment="scripts">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
        </script>

        <script>
            window.addEventListener('DOMContentLoaded', event => {

                const sidebarToggle =
                    document.body.querySelector('#sidebarToggle');

                if (sidebarToggle) {

                    sidebarToggle.addEventListener('click', event => {

                        event.preventDefault();

                        document.body.classList.toggle('sb-sidenav-toggled');

                    });
                }
            });
        </script>

    </th:block>

</body>
</html>
