
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Students</h2>

                <a th:href="@{/students/new}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>
                    Add New Student
                </a>
            </div>

            <div th:if="${successMessage != null}"
                 class="alert alert-success text-center"
                 th:text="${successMessage}">
            </div>

            <div th:if="${message != null}"
                 class="alert alert-success text-center"
                 th:text="${message}">
            </div>

            <div class="card mb-4">

                <div class="card-header bg-white">
                    <i class="bi bi-people me-1"></i>
                    Student List
                </div>

                <div class="card-body">

                    <!-- Search Form -->
                    <form th:action="@{/students/list}"
                          method="get"
                          class="row g-2 mb-4">

                        <div class="col-md-8">
                            <input type="text"
                                   name="keyword"
                                   class="form-control"
                                   placeholder="Search by name, email or phone..."
                                   th:value="${keyword}">
                        </div>

                        <div class="col-md-2">
                            <input type="hidden" name="size" value="10">
                            <button type="submit"
                                    class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>

                        <div class="col-md-2">
                            <a th:href="@{/students/list}"
                               class="btn btn-secondary w-100">
                                <i class="bi bi-x-circle"></i> Clear
                            </a>
                        </div>
                    </form>

                    <div class="text-muted"
                         th:if="${students.content.isEmpty()}">
                        No students found.
                    </div>

                    <div class="table-responsive"
                         th:if="${!students.content.isEmpty()}">

                        <table class="table table-hover table-striped">

                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="student : ${students.content}">

                                <td th:text="${student.id}"></td>

                                <td th:text="|${student.firstName} ${student.lastName}|"></td>

                                <td th:text="${student.email}"></td>

                                <td th:text="${student.phoneNumber}"></td>

                                <td>
                                    <!-- View Button -->
                                    <a th:href="@{/students/view/{id}(id=${student.id})}"
                                       class="btn btn-sm btn-info text-white me-1"
                                       title="View">
                                        <i class="bi bi-eye"></i>
                                    </a>

                                    <!-- Edit Button -->
                                    <a th:href="@{/students/edit/{id}(id=${student.id})}"
                                       class="btn btn-sm btn-warning text-white me-1"
                                       title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <!-- Delete Button -->
                                    <form th:action="@{/students/delete/{id}(id=${student.id})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete this student?');">

                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">

                                        <button type="submit"
                                                class="btn btn-sm btn-danger"
                                                title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>

                                    </form>
                                </td>

                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav aria-label="Student pagination"
                         th:if="${students.totalPages > 1}">

                        <ul class="pagination justify-content-end">

                            <li class="page-item"
                                th:classappend="${!students.hasPrevious()} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/students/list(page=${students.number - 1},size=${students.size},keyword=${keyword})}">
                                    Previous
                                </a>
                            </li>

                            <li class="page-item active">
                                <span class="page-link"
                                      th:text="${students.number + 1}">
                                </span>
                            </li>

                            <li class="page-item disabled">
                                <span class="page-link"
                                      th:text="|of ${students.totalPages}|">
                                </span>
                            </li>

                            <li class="page-item"
                                th:classappend="${!students.hasNext()} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/students/list(page=${students.number + 1},size=${students.size},keyword=${keyword})}">
                                    Next
                                </a>
                            </li>

                        </ul>
                    </nav>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
